name: sensecraft_voice_app
description: "Complete companion demo for the SenseCraft Voice SDK."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  record: ^6.2.0
  just_audio: ^0.10.5
  flutter_secure_storage: ^9.2.4
  http: ^1.6.0

  sensecraft_voice:
    path: ..

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
