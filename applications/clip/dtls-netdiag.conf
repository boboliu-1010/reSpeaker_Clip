# Preserve IPv4/Wi-Fi observations without depending on a TCP stack.
# TCP fields in the diagnostic schema remain zero when TCP is absent.
CONFIG_CLIP_WIFI_DIAG=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_PER_INTERFACE=y
CONFIG_NET_STATISTICS_USER_API=y
CONFIG_NET_STATISTICS_IPV4=y
CONFIG_NET_STATISTICS_TCP=n
CONFIG_NET_STATISTICS_ICMP=n
CONFIG_NET_STATISTICS_UDP=n
CONFIG_NET_STATISTICS_ETHERNET=n
CONFIG_NET_STATISTICS_WIFI=n
CONFIG_NET_STATISTICS_DNS=n
