# Development endpoint. Generate and transfer its public certificate over SSH.
# Install as ~/.config/systemd/user/boa-audio-storage.service.d/9528-https.conf.
[Service]
ExecStart=
ExecStart=%h/apps/boa-voice/venv/bin/python run.py --data-dir %h/.local/share/boa-audio-storage --host 0.0.0.0 --port 9528 --ssl-certfile %h/.local/share/boa-audio-storage/tls/server.pem --ssl-keyfile %h/.local/share/boa-audio-storage/tls/server.key
